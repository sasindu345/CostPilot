# Production stack for one small server (2 GB memory, plus 2 GB swap).
# Images come from GHCR. Settings come from Parameter Store, through fetch-settings.sh.
# Qdrant is not here: production uses Qdrant Cloud.
name: costpilot

x-backend: &backend
  image: ${IMAGE_PREFIX:?set by deploy.sh}-api:${IMAGE_TAG:?set by deploy.sh}
  restart: unless-stopped
  env_file: .env
  environment: &backend-addresses
    APP_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
    STORAGE_BACKEND: s3
    SESSION_COOKIE_SECURE: "true"
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set in Parameter Store}
      ACME_EMAIL: ${ACME_EMAIL:?set in Parameter Store}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    logging: *logging
    depends_on:
      - web
      - api
      - keycloak

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    # Small settings for a small server.
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40, -c, work_mem=4MB]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in Parameter Store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Parameter Store}
      POSTGRES_DB: ${POSTGRES_DB:?set in Parameter Store}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set in Parameter Store}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in Parameter Store}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in Parameter Store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: ${IMAGE_PREFIX}-keycloak:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in Parameter Store}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in Parameter Store}
      # Caddy handles HTTPS and passes the visitor's address on.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?set in Parameter Store}
      # The admin console is only reachable through an AWS tunnel. See docs/guides/deployment.md.
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:?set in Parameter Store}/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?set in Parameter Store}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?set in Parameter Store}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in Parameter Store}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:?set in Parameter Store}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:?set in Parameter Store}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:?set in Parameter Store}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:?set in Parameter Store}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:?set in Parameter Store}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set in Parameter Store}
    ports:
      - 127.0.0.1:${KEYCLOAK_ADMIN_PORT}:8080
    mem_limit: 1g
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *backend
    restart: "no"
    command: [alembic, upgrade, head]
    healthcheck:
      disable: true
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    # Trust the visitor address that Caddy passes on. Only Caddy can reach this port.
    command: [uvicorn, costpilot.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    mem_limit: 384m
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  worker:
    <<: *backend
    command: [python, -m, costpilot.worker]
    healthcheck:
      disable: true
    mem_limit: 384m
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${IMAGE_PREFIX}-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
    mem_limit: 192m
    logging: *logging
    depends_on:
      - api

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
