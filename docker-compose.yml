# Local development stack. Run `make up` to start it.
# Ports only listen on your own computer (127.0.0.1), never on your network.
name: costpilot

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?set in .env}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - 127.0.0.1:${QDRANT_PORT:?set in .env}:6333
    volumes:
      - qdrant_data:/qdrant/storage

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:?set in .env}:8080
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:?set in .env}:8025
      - 127.0.0.1:${MAILPIT_SMTP_PORT:?set in .env}:1025

  api:
    build:
      context: apps/api
    env_file: .env
    ports:
      - 127.0.0.1:${API_PORT:?set in .env}:8000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: apps/web
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:?set in .env}
    ports:
      - 127.0.0.1:${WEB_PORT:?set in .env}:3000
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
