# Local development stack. Run `make up` to start it.
# Ports only listen on your own computer (127.0.0.1), never on your network.
name: costpilot

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:?set in .env}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - 127.0.0.1:${QDRANT_PORT:?set in .env}:6333
    volumes:
      - qdrant_data:/qdrant/storage

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?set in .env}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?set in .env}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?set in .env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in .env}
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:?set in .env}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:?set in .env}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:?set in .env}
      KEYCLOAK_SMTP_AUTH: ${KEYCLOAK_SMTP_AUTH:?set in .env}
      KEYCLOAK_SMTP_STARTTLS: ${KEYCLOAK_SMTP_STARTTLS:?set in .env}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set in .env}
    volumes:
      - ./infra/keycloak/realm-costpilot.json:/opt/keycloak/data/import/realm-costpilot.json:ro
      - ./infra/keycloak/themes/costpilot:/opt/keycloak/themes/costpilot:ro
      - ./apps/web/src/styles:/opt/keycloak/themes/costpilot/login/resources/css/shared:ro
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:?set in .env}:8080
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - 127.0.0.1:${MAILPIT_UI_PORT:?set in .env}:8025
      - 127.0.0.1:${MAILPIT_SMTP_PORT:?set in .env}:1025

  migrate:
    build:
      context: apps/api
    command: [alembic, upgrade, head]
    healthcheck:
      disable: true
    env_file: .env
    environment: &backend-addresses
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      STORAGE_LOCAL_PATH: /app/uploads
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: apps/api
    env_file: .env
    environment: *backend-addresses
    volumes:
      - uploads_data:/app/uploads
    ports:
      - 127.0.0.1:${API_PORT:?set in .env}:8000
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: apps/api
    command: [python, -m, costpilot.worker]
    healthcheck:
      disable: true
    env_file: .env
    environment: *backend-addresses
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: apps/web
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:?set in .env}
    ports:
      - 127.0.0.1:${WEB_PORT:?set in .env}:3000
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
