[project]
name = "costpilot"
version = "0.1.0"
description = "AI cloud cost management platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.20.1",
  "asyncpg>=0.32.0",
  "beautifulsoup4>=4.15.0",
  "boto3>=1.43.123",
  "cryptography>=50.0.2",
  "fastapi>=0.120",
  "httpx2>=2.16.0",
  "langchain-core>=1.7.3",
  "langchain-google-genai>=4.4.2",
  "langchain-text-splitters>=1.1.3",
  "langgraph>=1.2.19",
  "numpy>=2.5.4",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
  "opentelemetry-sdk>=1.45.2",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.15.1",
  "python-multipart>=0.0.33",
  "pyyaml>=6.0.3",
  "qdrant-client>=1.20.0",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=25.1",
  "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
  "bandit>=1.8",
  "httpx2>=2.16.0",
  "import-linter>=2.5",
  "moto[s3]>=5.2.5",
  "pytest>=8.4",
  "pytest-asyncio>=1.4.1.post1",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/costpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"migrations/versions/*" = ["S608"]
"tests/unit/test_bill_readers.py" = ["S101", "E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.importlinter]
root_package = "costpilot"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Each module keeps its layers in order"
type = "layers"
layers = ["api | infrastructure", "application", "domain"]
containers = [
  "costpilot.modules.identity",
  "costpilot.modules.documents",
  "costpilot.modules.billing",
  "costpilot.modules.analytics",
  "costpilot.modules.recommendations",
  "costpilot.modules.assistant",
  "costpilot.modules.knowledge",
  "costpilot.modules.audit",
]

[[tool.importlinter.contracts]]
name = "Domain code stays free of outside tools"
type = "forbidden"
source_modules = [
  "costpilot.modules.identity.domain",
  "costpilot.modules.documents.domain",
  "costpilot.modules.billing.domain",
  "costpilot.modules.analytics.domain",
  "costpilot.modules.recommendations.domain",
  "costpilot.modules.assistant.domain",
  "costpilot.modules.knowledge.domain",
  "costpilot.modules.audit.domain",
]
forbidden_modules = [
  "boto3",
  "bs4",
  "cryptography",
  "fastapi",
  "httpx2",
  "jwt",
  "langchain_core",
  "langchain_google_genai",
  "langchain_text_splitters",
  "langgraph",
  "numpy",
  "pydantic_settings",
  "qdrant_client",
  "sqlalchemy",
  "structlog",
  "uvicorn",
]
