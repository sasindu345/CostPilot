name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Project rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Block hardcoded values
        run: python3 scripts/check_no_hardcoded.py
      - name: Block secrets
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact
      - name: Block AI co-author lines
        run: |
          git log --format=%B > commit-messages.txt
          python3 scripts/check_commit_msg.py commit-messages.txt

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: Start a test database
        working-directory: .
        run: |
          python3 scripts/sync_env.py
          docker compose up --detach --wait postgres
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run bandit --quiet --recursive src --configfile pyproject.toml
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      API_INTERNAL_URL: http://api:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - name: Check the API types are up to date
        working-directory: .
        run: |
          python3 scripts/sync_env.py
          make types
          git diff --exit-code apps/web/src/lib/api-types.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
      - name: Check Terraform
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
      - name: Scan Terraform, Dockerfiles and workflows for security problems
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          config_file: .checkov.yaml
      - name: Check the server scripts
        run: shellcheck infra/production/*.sh infra/postgres/*.sh
      - name: Check the production Compose file
        working-directory: infra/production
        run: |
          cp settings.example .env
          IMAGE_PREFIX=ghcr.io/example/costpilot IMAGE_TAG=check docker compose config --quiet

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, infrastructure]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/costpilot
      SOURCE_LABEL: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: |
          docker build --label "$SOURCE_LABEL" --tag "$IMAGE_PREFIX-api:$GITHUB_SHA" apps/api
          docker build --label "$SOURCE_LABEL" --tag "$IMAGE_PREFIX-web:$GITHUB_SHA" \
            --build-arg API_INTERNAL_URL=http://api:8000 apps/web
          docker build --label "$SOURCE_LABEL" --tag "$IMAGE_PREFIX-keycloak:$GITHUB_SHA" \
            --build-context styles=apps/web/src/styles \
            --file infra/keycloak/Dockerfile infra/keycloak
      - name: Scan images for known problems
        run: |
          for name in api web keycloak; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.1 image --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$IMAGE_PREFIX-$name:$GITHUB_SHA"
          done
      # Only main is published. The Deploy workflow starts when this run passes.
      - name: Publish images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for name in api web keycloak; do
            docker push --quiet "$IMAGE_PREFIX-$name:$GITHUB_SHA"
          done
      # Private repositories get 500 MB of free image storage, so keep only recent versions.
      - name: Remove old images
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: costpilot-api
          package-type: container
          min-versions-to-keep: 3
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: costpilot-web
          package-type: container
          min-versions-to-keep: 3
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: costpilot-keycloak
          package-type: container
          min-versions-to-keep: 3
